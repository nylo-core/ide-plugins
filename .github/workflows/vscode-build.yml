name: VS Code Build

on:
  push:
    branches: [main]
    paths:
      - 'vscode/**'
      - '.github/workflows/vscode-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vscode/**'
      - '.github/workflows/vscode-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vscode

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test
