# Plugin coordinates
pluginGroup = dev.nylo.plugin
pluginName = Nylo
pluginVersion = 0.1.1
pluginRepositoryUrl = https://github.com/nylo-core/nylo-plugin

# Compatibility range — build 243 (AS 2024.3) through build 261 (AS 2026.1).
# Bumped to 261.* so the plugin loads in the current AS (build 261); drop the cap for an open range.
pluginSinceBuild = 243
pluginUntilBuild = 261.*

# IDE used for sandbox + Plugin Verifier
# Match the earliest supported AS (build 243 = AS Meerkat / 2024.3) for compile-time API safety.
# The user's actual AS install (2026.1.1 / build 261) is covered via pluginUntilBuild=261.*.
platformType = AI
platformVersion = 2024.3.2.15

# Bundled IntelliJ-Platform plugins required at runtime (comma-separated; none currently)
platformBundledPlugins =

# Marketplace plugins required at runtime
# Flutter 88.1.0: since 243.0, until 253.* — covers our pluginSinceBuild..pluginUntilBuild range
platformPlugins = io.flutter:88.1.0

# Build / language
javaVersion = 21
kotlinVersion = 2.2.0
gradleVersion = 9.0.0

# Performance
org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx4g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin
kotlin.stdlib.default.dependency = false
kotlin.daemon.jvmargs = -Xmx2g
